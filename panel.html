function localStore(){const mem={},subs={};
 const load=n=>{try{mem[n]=JSON.parse(localStorage.getItem('rk_'+n)||'{}')}catch(e){mem[n]=mem[n]||{}}};
 const rows=n=>Object.entries(mem[n]).map(([id,v])=>Object.assign({},v,{id}));
 const emit=n=>(subs[n]||[]).forEach(f=>f(rows(n)));
 const save=n=>{try{localStorage.setItem('rk_'+n,JSON.stringify(mem[n]))}catch(e){}};
 addEventListener('storage',e=>{if(e.key&&e.key.indexOf('rk_')===0){const n=e.key.slice(3);load(n);emit(n)}});
 return{mode:'local',sub(n,f){load(n);(subs[n]=subs[n]||[]).push(f);f(rows(n))},
  set(n,id,d){load(n);mem[n][id]=d;save(n);emit(n);return true},del(n,id){load(n);delete mem[n][id];save(n);emit(n)}}}

   $('#ys').onclick=go;$('#ya').onkeydown=$('#ytt').onkeydown=e=>{if(e.key==='Enter')go()};
   $('#yo').onclick=e=>{e.currentTarget.href='https://www.youtube.com/results?search_query='+encodeURIComponent((qs()||'karaoke')+' karaoke')};
   $('#yr').onclick=e=>{const b=e.target.closest('[data-add]');if(!b)return;const i=+b.dataset.add,x=yres[i],t=$('[data-ti="'+i+'"]').value.trim(),a=$('[data-ai="'+i+'"]').value.trim();if(!t||!a)return toast('Escribe título e intérprete');
    const id=uid('s');b.disabled=true;b.textContent='Guardando…';Promise.resolve(store.set('songs',id,{title:t,artist:a,video:x.id,lang:$('#yl').value,voz:$('#yv').value})).then(ok=>{if(ok===false){b.disabled=false;b.textContent='Agregar al catálogo';return}mark(id);toast('✓ Agregada al catálogo: '+t)})}},
  upd(){const r=$('#yr');if(!r)return;const g=(Array.isArray(yres)?yres.map(x=>x.id).join():String(yres))+'|'+S.songs.length+'|'+Object.keys(S._sv||{}).join();if(g===sig)return;sig=g;
   if(yres==null)r.innerHTML='<p class="mut small">Escribe un artista o una canción y pulsa Buscar. Se buscan videos de karaoke que permiten reproducirse en la pantalla.</p>';
   else if(yres==='load')r.innerHTML='<p class="mut">Buscando…</p>';
   else if(typeof yres==='string')r.innerHTML='<p class="glow">'+esc(yres.slice(4))+'</p>';
   else{const have=new Set(S.songs.map(s=>s.video)),art=$('#ya')?$('#ya').value.trim():'';r.innerHTML=yres.length?yres.map((x,i)=>'<div class="song">'+(x.th?'<img class="th" loading="lazy" alt="" src="'+esc(x.th)+'">':'')+'<div class="grow"><b>'+esc(x.title)+'</b><div class="mut small">'+esc(x.ch)+'</div></div><a class="btn ghost sm" target="_blank" rel="noopener" href="https://www.youtube.com/watch?v='+esc(x.id)+'">Probar</a>'+
     (have.has(x.id)?'<span class="tag ok">✓ En el catálogo</span>':'<input data-ti="'+i+'" value="'+esc(cleanT(x.title))+'" style="flex:1 1 150px" aria-label="Título"><input data-ai="'+i+'" value="'+esc(art)+'" placeholder="Intérprete" style="flex:1 1 120px" aria-label="Intérprete"><button class="btn sm" data-add="'+i+'">Agregar al catálogo</button>')+'</div>').join(''):'<p class="mut">Sin resultados. Prueba con otro artista o escribe el título.</p>'}}},

 qr:{mount(){const c=cfg();$('#pb').innerHTML='<div class="row" style="margin-bottom:12px"><input id="nmz" type="number" min="1" max="60" value="'+esc(c.mesas)+'" aria-label="Cantidad de mesas"><button class="btn" id="gen">Generar QR</button><button class="btn ghost" onclick="print()">Imprimir</button></div><div class="qrs" id="qg"></div><p class="small mut">Cada QR abre la rockola ya ubicada en su mesa.</p>';
   const g=()=>{const k=Math.min(60,Math.max(1,parseInt($('#nmz').value)||1));$('#qg').innerHTML=Array.from({length:k},(_,i)=>'<div class="card">'+qrSvg(root()+'?mesa='+(i+1))+'<b>Mesa '+(i+1)+'</b></div>').join('')};$('#gen').onclick=g;g()},upd(){}},
 aj:{mount(){const c=cfg();$('#pb').innerHTML='<div class="card stack"><label>Nombre del local<input id="s1" value="'+esc(c.bar)+'"></label><label>Pedidos máximos por mesa<input id="s2" type="number" min="1" value="'+esc(c.max)+'"></label><label>Cantidad de mesas<input id="s3" type="number" min="1" value="'+esc(c.mesas)+'"></label>'+
   '<label class="row"><input type="checkbox" id="s4" style="width:auto"'+(c.premium?' checked':'')+'> Activar versión premium (prioridad pagada)</label><label>Precio de la prioridad (Bs)<input id="s5" type="number" min="0" value="'+esc(c.price)+'"></label>'+
   '<label class="row"><input type="checkbox" id="s6" style="width:auto"'+(c.auto?' checked':'')+'> Pasar al siguiente cuando termine el video</label>'+
   '<label class="row"><input type="checkbox" id="s12" style="width:auto"'+(c.fsAuto?' checked':'')+'> Poner el video en pantalla completa después de presentar al cantante</label>'+
   '<label class="row"><input type="checkbox" id="s8" style="width:auto"'+(c.cam?' checked':'')+'> Mostrar la cámara del cantante en la pantalla</label><label>Posición de la cámara<select id="s9">'+[['br','Abajo derecha'],['bl','Abajo izquierda'],['tr','Arriba derecha'],['tl','Arriba izquierda']].map(o=>'<option value="'+o[0]+'"'+(c.camPos===o[0]?' selected':'')+'>'+o[1]+'</option>').join('')+'</select></label>'+
   '<label class="row"><input type="checkbox" id="s11" style="width:auto"'+(c.ytClient!==false?' checked':'')+'> Permitir que los clientes busquen karaokes en YouTube</label><label>Clave de YouTube Data API<input id="s10" value="'+esc(c.ytKey)+'" placeholder="AIza…" autocomplete="off"></label><p class="small mut" style="margin:0">Sirve para buscar karaokes nuevos. La pestaña Guía explica cómo crearla. Restríngela a tu dominio en Google Cloud, porque los clientes la usan desde su celular.</p>'+
   '<label>Búsquedas de YouTube por celular y por hora (0 = sin límite)<input id="s13" type="number" min="0" value="'+esc(c.ytLim)+'"></label><label>PIN del panel<input id="s7" value="'+esc(c.pin)+'"></label><button class="btn" id="sv">Guardar ajustes</button></div>';
   $('#sv').onclick=()=>{const b=$('#sv');b.disabled=true;Promise.resolve(store.set('cfg','main',{bar:$('#s1').value.trim()||DEF.bar,max:+$('#s2').value||3,mesas:+$('#s3').value||12,premium:$('#s4').checked,price:+$('#s5').value||0,auto:$('#s6').checked,fsAuto:$('#s12').checked,cam:$('#s8').checked,camPos:$('#s9').value,ytClient:$('#s11').checked,ytKey:$('#s10').value.trim(),ytLim:(l=>isNaN(l)?5:Math.max(0,l))(parseInt($('#s13').value)),pin:$('#s7').value.trim()||'1234'})).then(ok=>{b.disabled=false;if(ok!==false)toast('✓ Ajustes guardados')})}},upd(){}},
 gd:{mount(){$('#pb').innerHTML=guiaOperador()},upd(){}}};

 function show(){cur=tabs[tab];[...$('#tb').children].forEach(b=>b.classList.toggle('on',b.dataset.t===tab));cur.mount();cur.upd()}
 view={upd(){if(cur)cur.upd()}};show()}
function sessionStorageOK(k,v){try{if(v!==undefined)sessionStorage.setItem(k,v);return sessionStorage.getItem(k)}catch(e){return window['_'+k]=v!==undefined?v:window['_'+k]}}

/* ---------- conexión ---------- */
function netWatch(){if(window._nw)return;window._nw=1;
 const msg={cliente:'Sin conexión. Tus pedidos se enviarán cuando vuelva el internet.',panel:'Sin conexión. Los cambios se guardarán cuando vuelva el internet.',pantalla:'Sin conexión. La música continuará cuando vuelva el internet.'}[PAGE]||'Sin conexión.';
 const el=document.createElement('div');el.id='off';el.setAttribute('role','status');el.hidden=true;document.body.appendChild(el);
 let off=false,hide;
 const set=v=>{if(v===off)return;off=v;window._off=v;clearTimeout(hide);if(v){el.className='';el.textContent='⚠ '+msg;el.hidden=false}else{el.className='back';el.textContent='✓ Conexión recuperada';el.hidden=false;hide=setTimeout(()=>{el.hidden=true},3500);try{window.onNetBack&&window.onNetBack()}catch(e){}}};
 const ping=async()=>{if(!navigator.onLine)return set(true);if(!/^https?:/.test(location.protocol))return set(false);
  try{const c=new AbortController(),t=setTimeout(()=>c.abort(),5000);await fetch(location.href.split('#')[0].split('?')[0]+'?_='+Date.now(),{method:'HEAD',cache:'no-store',signal:c.signal});clearTimeout(t);set(false)}catch(e){set(true)}};
 addEventListener('offline',()=>set(true));addEventListener('online',ping);setInterval(ping,10000);ping()}

/* ---------- ruteo e inicio ---------- */
function route(){window.onmessage=null;if(PAGE==='cliente')document.title='Rockola · Pide tu canción';
 if(PAGE==='pantalla')pantalla();else if(PAGE==='panel')panel();else if(PAGE==='cliente'){const m=parseInt(new URLSearchParams(location.search).get('mesa'));m>0?mesa(m):pickMesa()}else home();netWatch()}
function attach(st){store=st;['songs','queue','cfg','claps'].forEach(n=>st.sub(n,r=>{if(store!==st)return;S[n]=r;(S._l=S._l||{})[n]=1;try{view.upd()}catch(e){console.error(e)}}))}
async function init(){
 addEventListener('hashchange',route);
 if(FB.apiKey&&FB.apiKey!=='PEGA_AQUI'){try{attach(await fireStore());route();return}catch(e){console.error(e);toast('No se pudo conectar a Firebase')}}
 attach(localStore());route();toast('Modo local: falta pegar la configuración de Firebase')}
init();
</script>
